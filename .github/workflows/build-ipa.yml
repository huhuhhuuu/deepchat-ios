name: Build unsigned IPA

# 在没有 Mac 的情况下，用 GitHub 的 macOS 机器打包出未签名 IPA，
# 下载后用 Sideloadly / AltStore 在 Windows 上自签安装。
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - "DeepChat/**"
      - "DeepChat.xcodeproj/**"
      - ".github/workflows/build-ipa.yml"

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project DeepChat.xcodeproj \
            -scheme DeepChat \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/DeepChat.app"
          if [ ! -d "$APP" ]; then
            echo "找不到构建产物：$APP" >&2
            exit 1
          fi
          rm -rf Payload DeepChat-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry DeepChat-unsigned.ipa Payload
          ls -lh DeepChat-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DeepChat-unsigned-ipa
          path: DeepChat-unsigned.ipa
          retention-days: 30
